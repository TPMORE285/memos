name: Build and Push to ACR

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: memos

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name memosacr

      - name: Build Docker image
        run: |
          docker build -t memosacr.azurecr.io/memos:latest .

      - name: Push Docker image
        run: |
          docker push memosacr.azurecr.io/memos:latest
